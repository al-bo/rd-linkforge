name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: |
          go build ./...
          cd pkg && go build ./...

      - name: Vet
        run: |
          go vet ./...
          cd pkg && go vet ./...

      - name: Test
        run: |
          go test -race ./...
          cd pkg && go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # v8 is the first release that installs golangci-lint v2, which this
      # repository's config targets and which supports Go 1.25 modules.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: pkg
